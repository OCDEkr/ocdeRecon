# Nessus vulnerability scan via the local REST API (kind: rest).
# Driven by pentui.core.runner.RestRunner — NOT an argv subprocess. The runner
# launches a scan on the engagement's in-scope targets against the local Nessus
# (default https://localhost:8834), polls it, exports the .nessus file, and the
# `nessus` parser merges its vulnerabilities into the unified model.
#
# Connection + API keys come from settings.json ('nessus': {url, access_key,
# secret_key}) or NESSUS_URL / NESSUS_ACCESS_KEY / NESSUS_SECRET_KEY — never from
# this manifest (it ships in the wheel). Generate keys in the Nessus UI under
# Settings > My Account > API Keys. REST tools run via workflows, not the manual
# scan screen. `binary` is unused by the REST runner but kept for the availability
# hint on machines where the Nessus CLI is installed.
name: nessus
kind: rest
binary: nessuscli
description: "Nessus vulnerability scan (local REST API)"

target:
  mode: append            # targets become the scan's text_targets

output:
  stream: stdout          # scan status is streamed to the monitor
  parser: nessus          # parses the exported .nessus (nessus_v2 XML)
