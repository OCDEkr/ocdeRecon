# Subnet recon: masscan a range, nmap each /24 that has live hosts (one XML per
# subnet), then gowitness across all of them. Demonstrates per-/24 fan-out
# (foreach) and the artifact handoff (file_from): the nmap step collects one XML
# per /24, and gowitness batches over that directory.
#
# Set the engagement's targets/scope to the range to sweep (e.g. a /16), then run.
# The per-/24 nmap scans run concurrently, bounded by `max_parallel` below (else
# config.max_concurrent_scans, default 4) — so a /16 with dozens of live /24s
# doesn't crawl one-at-a-time.
name: subnet-recon
description: "masscan a range, nmap per /24, screenshot every web service found"
defaults:
  gates: true
  max_parallel: 4               # at most N /24 nmap scans in flight at once

steps:
  - id: discover
    tool: masscan
    profile: "Top TCP"            # fast sweep for live hosts / common ports (root)
    targets: {from: project}

  - id: scan
    tool: nmap
    profile: "Service scan"
    after: [discover]
    foreach: subnet/24            # run nmap once per /24 that masscan found hosts in
    foreach_target: subnet        # scan the whole /24 (catches hosts masscan missed),
                                  # not just masscan's hits — never the full /16
    input: {from: hosts, where: {host_state: up}, as: targets}

  - id: shots
    tool: gowitness
    profile: "Scan from nmap XML"
    after: [scan]
    file_from: {step: scan, flag: "-f"}   # gowitness -f <dir of per-/24 nmap XMLs>
    gate: false
