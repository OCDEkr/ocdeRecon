# dc-discovery — find Active Directory domain controllers in scope.
#
#   discover : nmap the engagement targets for DC service ports
#              (88 Kerberos, 389/636 LDAP/LDAPS, 3268 Global Catalog)
#   identify : nxc ldap the LDAP responders -> tags host.is_dc + records the domain
#
# The DCs are then queryable (where: {is_dc: true}) by any later AD step. Handoff
# is via the unified model. Scope applies to every step, so only in-scope hosts
# are probed.
name: dc-discovery
description: "Discover and tag Active Directory domain controllers"

steps:
  - id: discover
    tool: nmap
    options: {"-p": "88,389,636,3268"}
    targets: {from: project}

  - id: identify
    tool: dc-discovery
    profile: Identify
    after: [discover]
    input: {from: hosts, where: {port_open_in: [389]}, as: ip_list}
