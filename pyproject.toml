[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pentui"
version = "0.0.1"
description = "A TUI that wraps and automates command-line offensive-security tools (Nmap PoC)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "OCDE Cybersecurity" }]
dependencies = [
    "textual>=0.60",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    # SQLCipher driver (bundled native lib via wheel) for encrypted engagements.
    "sqlcipher3-binary>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "textual-dev>=1.5",
    "types-PyYAML>=6.0",
    "pyinstaller>=6.0",
]

[project.scripts]
pentui = "pentui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pentui"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pentui"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["textual.*", "sqlcipher3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
